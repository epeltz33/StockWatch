{% extends "base.html" %}

{% block title %}Dashboard - StockWatch{% endblock %}

{% block content %}
<header class="topbar">
  <span class="topbar-brand"><span class="tick">▲</span>StockWatch</span>
  <div class="topbar-user">
    <span class="topbar-username">{{ user.username }}</span>
    <a href="{{ url_for('auth.logout') }}" class="btn btn-danger btn-sm" style="padding: 7px 14px; font-size: 0.85rem;">Log out</a>
  </div>
</header>

<iframe src="{{ dash_url }}" class="dash-frame" title="StockWatch dashboard"></iframe>
{% endblock %}

{% block scripts %}
<script src="{{ dash_url }}dash-renderer"></script>
<script id="_dash-config" type="application/json">
  {
    "url_base_pathname": "{{ dash_url }}"
  }
</script>
{% endblock %}
